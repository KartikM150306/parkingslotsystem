<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in/Check-out - Smart Parking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .scanner-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            padding: 30px;
        }
        .qr-scanner {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-parking"></i> Smart Parking System
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/slots">Parking Slots</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/bookings">Bookings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/users">Users</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/book-slot">Book Slot</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/login">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/signup">Sign Up</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card scanner-container">
                    <div class="card-body text-center">
                        <h1 class="mb-4">
                            <i class="fas fa-qrcode"></i> Check-in/Check-out
                        </h1>
                        <p class="lead mb-4">Scan QR code to check in or check out</p>
                        
                        <div class="qr-scanner">
                            <h5 class="text-dark mb-3">QR Code Scanner</h5>
                            <div class="mb-3">
                                <input type="text" class="form-control" id="qrInput" 
                                       placeholder="Enter QR code manually or scan with camera">
                            </div>
                            <button class="btn btn-primary btn-lg" onclick="processQRCode()">
                                <i class="fas fa-search"></i> Process QR Code
                            </button>
                        </div>
                        
                        <div class="mt-4">
                            <a href="/bookings" class="btn btn-light btn-lg">
                                <i class="fas fa-list"></i> View Bookings
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-light text-center text-muted py-3 mt-5">
        <div class="container">
            <p>&copy; 2024 Smart Parking System. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function processQRCode() {
            const qrCode = document.getElementById('qrInput').value.trim();
            if (qrCode) {
                window.location.href = '/process-qr/' + encodeURIComponent(qrCode);
            } else {
                alert('Please enter a QR code');
            }
        }
        
        // Allow Enter key to process QR code
        document.getElementById('qrInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                processQRCode();
            }
        });
    </script>
</body>
</html>
